name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workflow-lint:
    name: Workflow Lint
    permissions:
      contents: read
    uses: $/.github/workflows/workflow-lint.yaml

  definitions:
    name: Definitions
    needs: workflow-lint
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      MISE_PARANOID: 'true'
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
          disable-telemetry: true

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install development tools
        uses: jdx/mise-action@82a612c5ab8bcda7cc5db6b7e81a8e7584c3dc6e # v5.2.3
        with:
          version: '2026.11.2'
          install_args: --locked bun node python uv
          cache: false
          add_shims_to_path: false

      - name: Install validation dependencies
        run: bun install --frozen-lockfile

      - name: Prepare preset validator
        run: bun run setup:validation

      - name: Validate presets
        run: mise run check:presets

      - name: Exercise template delivery
        run: mise run check:templates
