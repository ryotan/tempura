[project]
name = "tempura"
version = "0.0.0"
requires-python = ">=3.13"

[dependency-groups]
copier = ["copier==9.19.1"]
workflow-lint = ["pyflakes==4.1.0"]

[tool.uv]
package = false
required-version = ">=0.13.7"
default-groups = []
exclude-newer = "7 days"
# Pyflakes has no runtime dependencies, and Renovate checks release age when updating its exact pin.
exclude-newer-package = { pyflakes = false }
